name: Check

on:
  pull_request:
    paths:
      - .github/workflows/check.yml
      - crates/**
      - Cargo.*
      - "!**/*.md"
  push:
    branches:
      - main
    paths:
      - .github/workflows/check.yml
      - crates/**
      - Cargo.*
      - "!**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  cargo-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run cargo fmt
        run: |
          rustup component add rustfmt
          cargo fmt \
            --all \
            --check

  cargo-clippy:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run cargo clippy
        run: |
          rustup component add clippy
          cargo clippy \
            --all-targets \
            --all-features \
            --locked \
            -- \
            -D warnings

  cargo-msrv:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: baptiste0928/cargo-install@f204293d9709061b7bc1756fec3ec4e2cd57dec0 # v3.4.0
        with:
          crate: cargo-msrv
          version: 0.19.3
      - name: Run cargo msrv
        run: |
          # Verify MSRV for each package
          find crates -mindepth 2 -name Cargo.toml | while read -r manifest
          do
            echo "Checking package $manifest"
            cargo msrv verify --manifest-path "$manifest" || exit 1
          done

  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run tests
        run: >
          cargo test
          --all-targets
          --all-features
          --workspace
          --locked

  library-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test isolated library features and dependency trees
        run: |
          # Separate Cargo invocations avoid CLI feature unification while
          # reusing dependencies in one runner's target directory.
          for package in rd2qmd-core rd2qmd-package; do
            for features in default none grid-table; do
              echo "::group::$package ($features)"
              args=()
              case "$features" in
                none) args+=(--no-default-features) ;;
                grid-table) args+=(--no-default-features --features grid-table) ;;
              esac
              cargo test -p "$package" "${args[@]}" --locked
              cargo clippy -p "$package" --all-targets "${args[@]}" --locked -- -D warnings
              cargo tree -p "$package" "${args[@]}" --locked --edges normal,build --prefix none > dependencies.txt
              if [[ "$features" == grid-table ]]; then
                grep -q '^tabled v' dependencies.txt
              elif grep -q '^tabled v' dependencies.txt; then
                echo 'Unexpected tabled dependency with grid-table disabled'
                exit 1
              fi
              echo '::endgroup::'
            done
          done
