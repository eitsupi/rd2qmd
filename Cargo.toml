[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/rd2qmd-cli"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.88.0"
license = "MIT"
repository = "https://github.com/eitsupi/rd2qmd"
homepage = "https://github.com/eitsupi/rd2qmd"
readme = "README.md"
keywords = ["r", "rd", "quarto", "markdown", "documentation"]

[workspace.dependencies]
# Core dependencies
thiserror = "2"
anyhow = "1"

# CLI dependencies
clap = { version = "4", features = ["derive"] }

# Parallel processing
rayon = "1"

# Serialization (for mdast compatibility)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
schemars = "1"

# Table generation (for Grid Tables)
tabled = { version = "0.21", default-features = false, features = ["std"] }

# External link resolution (optional)
r-description = "0.4.0"
saphyr = "0.0.11"
reqwest = { version = "0.13", features = ["blocking", "rustls"], default-features = false }
url = "2"

# R documentation AST and source parser
rd-ast = { version = "=0.0.1", features = ["serde"] }
rd-source = "=0.0.1"

# Testing
insta = { version = "1", features = ["yaml"] }

# Internal crates
rd2qmd-mdast = { version = "0.4.0", path = "crates/rd2qmd-mdast" }
rd2qmd-core = { version = "0.4.0", path = "crates/rd2qmd-core" }
rd2qmd-package = { version = "0.4.0", path = "crates/rd2qmd-package" }
rd2qmd-source = { version = "0.4.0", path = "crates/rd2qmd-source" }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
